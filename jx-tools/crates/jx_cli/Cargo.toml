[package]
name = "jx_cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jx"
path = "src/main.rs"

[dependencies]
jx_core = { path = "../jx_core" }
jx_git = { path = "../jx_git" }
jx_i18n = { path = "../jx_i18n" }
jx_ops = { path = "../jx_ops" }
jx_patch = { path = "../jx_patch" }
jx_workspace = { path = "../jx_workspace" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tempfile = "3"
