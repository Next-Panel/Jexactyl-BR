[package]
name = "jx_i18n"
version = "0.1.0"
edition = "2021"

[dependencies]
jx_core = { path = "../jx_core" }
jx_git = { path = "../jx_git" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lingua = { version = "1.8", default-features = false, features = ["english", "portuguese"] }
